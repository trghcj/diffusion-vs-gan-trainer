name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Code Hygiene (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff & Package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff

      - name: Run Ruff Linter
        run: ruff check src tests

      - name: Run Ruff Format Check
        run: ruff format --check src tests

  test-and-evaluate:
    name: Unit Tests & End-to-End Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Pytest Suite with Coverage
        run: |
          pytest --cov=src/genai_trainer --cov-report=term-missing --cov-report=xml

      - name: Execute End-to-End Generative Training & Evaluation Smoke Run
        run: |
          python -m genai_trainer.cli run-pipeline \
            --dataset synthetic \
            --epochs 1 \
            --num-samples 16

      - name: Verify Evaluation Artifacts Exist
        run: |
          test -f outputs/reports/metrics_summary.json
          test -f outputs/reports/comparison_report.md
          test -f outputs/reports/comparison_grid.png

      - name: Upload Evaluation Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-reports
          path: outputs/reports/
